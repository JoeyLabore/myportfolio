    <script>
      // Subtle tilt for About card (mirrors case study tile tilt)
      (function () {
        try {
          const aboutCard = document.querySelector('.about-card');
          if (!aboutCard) return;
          // Trigger intro animation on load (respect reduced motion)
          const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduceMotion) {
            // ensure starting state is applied, then add class next frame
            requestAnimationFrame(() => aboutCard.classList.add('about-enter'));
          }
          const supportsHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
          if (!supportsHover || reduceMotion) return;

          const MAX_TILT = 1; // degrees, keep ultra subtle like tiles
          const onMove = (e) => {
            const r = aboutCard.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width;  // 0..1
            const y = (e.clientY - r.top) / r.height;  // 0..1
            const dx = (x - 0.5) * 2; // -1..1
            const dy = (y - 0.5) * 2; // -1..1
            const tiltY = (dx * MAX_TILT).toFixed(2) + 'deg';
            const tiltX = (-dy * MAX_TILT).toFixed(2) + 'deg';
            aboutCard.style.setProperty('--tiltX', tiltX);
            aboutCard.style.setProperty('--tiltY', tiltY);
          };
          const onLeave = () => {
            aboutCard.style.setProperty('--tiltX', '0deg');
            aboutCard.style.setProperty('--tiltY', '0deg');
          };
          aboutCard.addEventListener('mousemove', onMove);
          aboutCard.addEventListener('mouseleave', onLeave);
        } catch (_) {
          /* ignore tilt errors */
        }
      })();
    </script>
