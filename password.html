<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Enter Password</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #000; color: #fff; font-family: Manrope, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
      .nav-split { position: relative; z-index: 2; }
      /* Ensure logo is pure white on black background */
      .page[data-name="password page"] .nav-logo img { filter: brightness(0) invert(1) !important; }
      /* Slightly lighter nav card on black for contrast */
      .page[data-name="password page"] .nav-bar { background: rgba(255,255,255,0.08); }
      /* Attention bounce for the right nav button */
      @keyframes softBounce {
        0%   { transform: translateY(0) scale(1); }
        20%  { transform: translateY(-2px) scale(1.02); }
        40%  { transform: translateY(0) scale(1); }
        60%  { transform: translateY(-1px) scale(1.01); }
        100% { transform: translateY(0) scale(1); }
      }
      .page[data-name="password page"] .nav-right.nav-connect .nav-item {
        animation: softBounce 2600ms ease-in-out infinite;
        will-change: transform;
      }
      /* Calm down when hovered/focused and honor reduced motion */
      .page[data-name="password page"] .nav-right.nav-connect .nav-item:hover,
      .page[data-name="password page"] .nav-right.nav-connect .nav-item:focus-visible {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .page[data-name="password page"] .nav-right.nav-connect .nav-item { animation: none !important; }
      }
      .pw-wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; }
      .pw-card { width: min(520px, 92vw); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(0,0,0,0.5); backdrop-filter: blur(4px) saturate(140%); }
      .pw-title { font-size: 20px; font-weight: 600; margin: 0 0 12px 0; }
      .pw-desc { font-size: 14px; opacity: 0.7; margin: 0 0 16px 0; }
      .pw-field { display: flex; gap: 8px; }
      .pw-input { flex: 1; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(0,0,0,0.4); color: #fff; padding: 0 12px; outline: none; }
      .pw-input::placeholder { color: rgba(255,255,255,0.5); }
      .pw-button { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.12); color: #fff; cursor: pointer; }
      .pw-button:hover, .pw-button:focus-visible { background: rgba(255,255,255,0.2); }
      /* Responsive: full-width modal with 8px side margins at 1050px and 600px breakpoints */
      @media (max-width: 1050px) {
        .page[data-name="password page"] .pw-wrap { padding: 0; }
        .page[data-name="password page"] .pw-card {
          width: calc(100% - 16px) !important; /* 8px left + 8px right */
          max-width: none !important;
          margin-left: 8px;
          margin-right: 8px;
        }
      }
      @media (max-width: 600px) {
        .page[data-name="password page"] .pw-wrap { padding: 0; }
        .page[data-name="password page"] .pw-card {
          width: calc(100% - 16px) !important;
          max-width: none !important;
          margin-left: 8px;
          margin-right: 8px;
        }
        /* Stack input and button; make button full width */
        .page[data-name="password page"] .pw-field { flex-direction: column; }
        .page[data-name="password page"] .pw-input { width: 100%; height: 48px; min-height: 48px; padding: 0 12px; -webkit-appearance: none; appearance: none; }
        .page[data-name="password page"] .pw-button { width: 100%; height: 48px; min-height: 48px; }
      }
    </style>
  </head>
  <body>
    <div class="page" data-name="password page">
      <!-- Top nav (same structure) -->
      <div class="nav-split" data-name="nav-split">
        <header class="nav-bar nav-left" aria-label="Logo">
          <div class="nav-logo">
            <a class="nav-logo-link" href="./index.html" aria-label="Home">
              <img src="./assets/logo.svg" alt="JG" width="24" height="24" />
            </a>
          </div>
        </header>
        <header class="nav-bar nav-right nav-connect" aria-label="Behance">
          <a class="nav-item" href="https://www.behance.net/joeys_portfolio" target="_blank" rel="noopener noreferrer">
            Behance
            <svg class="icon-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" focusable="false">
              <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"></path>
            </svg>
          </a>
        </header>
      </div>

      <main class="main" aria-label="Enter Password">
        <div class="pw-wrap">
          <div class="pw-card" role="form" aria-label="Enter Password">
            <h1 class="pw-title">Enter Password</h1>
            <p class="pw-desc">This project is protected. Please enter the password to continue.</p>
            <div class="pw-field">
              <input class="pw-input" type="password" placeholder="Password" aria-label="Password" />
              <button class="pw-button" type="button">Enter</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="./main.js?v=3"></script>
  </body>
</html>
