<!doctype html>

  <head>

    <link rel="icon" href="./assets/favicon.png" type="image/png" />
    <!-- Manrope font to match Figma token font/family/manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Material Symbols for MUI icons (lock) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <style>
      /* Disable hover/pressed/selected widen and tilt on home page tiles */
      .page[data-name="home page"] .tile-grid .tile.selected {
        flex: initial !important;
        transform: translateX(var(--slideX)) translateY(var(--introY)) !important;
      }
      .page[data-name="home page"] .tile-grid .tile:not(.selected):hover,
      .page[data-name="home page"] .tile-grid .tile.hover-proxy:not(.selected),
      .page[data-name="home page"] .tile-grid .tile:not(.selected):focus-visible {
        flex: initial !important;
      }
      /* Keep subtle 3D tilt on the hovered/focused tile; ensure it overrides prior rules */
      .page[data-name="home page"] .tile-grid .tile:hover,
      .page[data-name="home page"] .tile-grid .tile:focus-visible {
        transform: translateX(var(--slideX)) translateY(var(--introY)) perspective(800px) rotateX(var(--tiltX)) rotateY(var(--tiltY)) !important;
      }
      .page[data-name="home page"] .tile-grid .tile { --tiltX: 0deg; --tiltY: 0deg; }
    </style>
  </head>
  <body>

      <div class="intro-overlay__inner"></div>

            <a href="#" class="nav-item" role="tab" aria-selected="false" tabindex="-1" data-tab="ux">Product</a>
            <a href="#" class="nav-item" role="tab" aria-selected="false" tabindex="-1" data-tab="branding">Branding</a>

        <div class="nav-right-wrap" aria-label="Actions">

                <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"></path>
              </svg>
            </a>

        </div>
        <!-- Mobile-only menu button (<=600px) placed at top-right -->

          <a class="nav-item" href="#" aria-label="Open menu">
            <svg class="icon-menu" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" focusable="false">
              <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"></path>
            </svg>
          </a>
        </header>
      </div>
      <!-- Main content (blank home page) -->
      <main class="main" data-name="main" data-node-id="816:15570" style="margin-top: 96px;">
        <!-- Mobile overlay menu (hidden by default) -->
        <div class="mobile-menu-overlay" aria-hidden="true" role="dialog" aria-label="Menu">
          <div class="mobile-menu-panel">
            <a class="nav-item" href="./about.html">About</a>
            <a class="nav-item" href="mailto:joey.greenwood1997@gmail.com">
              Lets Connect

                <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"></path>

        </div>
      </main>

              <path fill="currentColor" d="M19 3A2 2 0 0 1 21 5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zm-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.7.39-2.22 1.04V10h-2.8v8.5h2.8v-5a1.67 1.67 0 0 1 1.67-1.67c.92 0 1.3.64 1.3 1.54v5.13h2.51zM6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68zM8.27 18.5V10h-2.8v8.5h2.8z"/>
            </svg>

          <a class="site-footer__icon" href="mailto:joey.greenwood1997@gmail.com" aria-label="Email">

    <script src="./main.js?v=4"></script>
