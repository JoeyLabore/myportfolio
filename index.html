<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joey Greenwood - Home</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png" />
    <!-- Manrope font to match Figma token font/family/manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Material Symbols for MUI icons (lock) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <style>
      /* Disable hover/pressed/selected widen and tilt on home page tiles */
      .page[data-name="home page"] .tile-grid .tile.selected {
        flex: initial !important;
        transform: translateX(var(--slideX)) translateY(var(--introY)) !important;
      }
      .page[data-name="home page"] .tile-grid .tile:not(.selected):hover,
      .page[data-name="home page"] .tile-grid .tile.hover-proxy:not(.selected),
      .page[data-name="home page"] .tile-grid .tile:not(.selected):focus-visible {
        flex: initial !important;
      }
      /* Keep subtle 3D tilt on the hovered/focused tile; ensure it overrides prior rules */
      .page[data-name="home page"] .tile-grid .tile:hover,
      .page[data-name="home page"] .tile-grid .tile:focus-visible {
        transform: translateX(var(--slideX)) translateY(var(--introY)) perspective(800px) rotateX(var(--tiltX)) rotateY(var(--tiltY)) !important;
      }
      .page[data-name="home page"] .tile-grid .tile { --tiltX: 0deg; --tiltY: 0deg; }
    </style>
  </head>
  <body>
    <!-- Home: black route overlay used to swipe in before navigating to NestBank -->
    <div class="intro-overlay" aria-hidden="true">
      <div class="intro-overlay__inner"></div>
    </div>
    <div class="page" data-name="home page" data-node-id="816:11957">
      <!-- Top row: logo left, tabs middle, LinkedIn right -->
      <div class="nav-split" data-name="nav-split">
        <header class="nav-bar nav-left" aria-label="Logo">
          <div class="nav-logo" data-name="logo-svg">
            <a class="nav-logo-link" href="./index.html" aria-label="Home">
              <img alt="" src="./assets/logo.svg" />
            </a>
          </div>
        </header>
        <header class="nav-bar nav-middle" data-name="nav-tabs" aria-label="Work filters">
          <nav class="tabs" role="tablist" aria-label="Work categories">
            <a href="#" class="nav-item active" role="tab" aria-selected="true" tabindex="0" data-tab="all">All</a>
            <a href="#" class="nav-item" role="tab" aria-selected="false" tabindex="-1" data-tab="ux">Product</a>
            <a href="#" class="nav-item" role="tab" aria-selected="false" tabindex="-1" data-tab="branding">Branding</a>
          </nav>
        </header>
        <div class="nav-right-wrap" aria-label="Actions">
          <header class="nav-bar nav-right nav-about" aria-label="About">
            <a class="nav-item" href="./about.html" aria-label="About">
              <img class="avatar" src="./assets/profile-photo.jpg" alt="Profile photo" />
            </a>
          </header>
          <header class="nav-bar nav-right nav-connect" aria-label="LinkedIn">
            <a class="nav-item" href="https://www.linkedin.com/in/josephgreenwood/" target="_blank" rel="noopener noreferrer">
              Lets Connect
              <svg class="icon-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" focusable="false">
                <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"></path>
              </svg>
            </a>
          </header>
        </div>
        <!-- Mobile-only menu button (<=600px) placed at top-right -->
        <header class="nav-bar nav-right nav-menu" aria-label="Menu">
          <a class="nav-item" href="#" aria-label="Open menu">
            <svg class="icon-menu" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" focusable="false">
              <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"></path>
            </svg>
          </a>
        </header>
      </div>
      <!-- Main content (blank home page) -->
      <main class="main" data-name="main" data-node-id="816:15570" style="margin-top: 96px;">
        <!-- Mobile overlay menu (hidden by default) -->
        <div class="mobile-menu-overlay" aria-hidden="true" role="dialog" aria-label="Menu">
          <div class="mobile-menu-panel">
            <a class="nav-item" href="./about.html">About</a>
            <a class="nav-item" href="https://www.linkedin.com/in/josephgreenwood/" target="_blank" rel="noopener noreferrer">
              Lets Connect
              <svg class="icon-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" focusable="false">
                <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"></path>
              </svg>
            </a>
          </div>
        </div>
        <!-- Page transition overlay (used when navigating to case studies) -->
        <div class="nav-transition" aria-hidden="true"></div>
        <div class="tile-grid filter-all">
          <div class="tile" data-category="ux" data-project="toyota"></div>
          <div class="tile" data-category="ux" data-project="relias"></div>
          <div class="tile" data-category="ux" data-project="orion"></div>
          <div class="tile" data-category="ux" data-project="nestbank"></div>
          <div class="tile" data-category="ux" data-project="medigo"></div>
          <div class="tile" data-category="branding" data-project="logofolio"></div>
          <div class="tile" data-category="branding" data-project="tom"></div>
          <div class="tile" data-category="branding" data-project="apendito"></div>
          <div class="tile" data-category="branding" data-project="kinti"></div>
          <div class="tile" data-category="branding" data-project="dinobytes"></div>
          <div class="tile" data-category="branding" data-project="kakaoala"></div>
          <div class="tile" data-category="branding" data-project="skilldex"></div>
        </div>
      </main>
    </div>
    <script src="./main.js?v=4"></script>
  </body>
</html>
