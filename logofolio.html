<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Joey Greenwood - Logofolio</title>
    <link rel="icon" href="./assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <style>
      /* Page-specific minimal styles to ensure canvas sits under the nav */
      html, body { height: 100%; }
      body { margin: 0; background: #F4EDEA; color: #000; }
      .logofolio-wrap { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; }
      #logofolio-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .nav-split { position: relative; z-index: 2; }
    </style>
  </head>
  <body>
    <div class="page" data-name="logofolio page">
      <!-- Top nav -->
      <div class="nav-split" data-name="nav-split">
        <header class="nav-bar nav-left" aria-label="Logo">
          <div class="nav-logo">
            <a class="nav-logo-link" href="./index.html" aria-label="Home">
              <img alt="" src="./assets/logo.svg" />
            </a>
          </div>
        </header>
        <header class="nav-bar nav-right" aria-label="Contact">
          <a class="nav-item" href="https://www.linkedin.com/in/josephgreenwood/" target="_blank" rel="noopener noreferrer">
            Lets Connect
            <svg class="icon-arrow" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" focusable="false">
              <path d="M9 5v2h6.59L4 18.59 5.41 20 17 8.41V15h2V5z"></path>
            </svg>
          </a>
        </header>
      </div>

      <main class="main" aria-label="Logofolio">
        <div class="logofolio-wrap">
          <canvas id="logofolio-canvas" aria-hidden="true"></canvas>
        </div>
      </main>
    </div>
    <script src="./main.js?v=3"></script>
  </body>
</html>
